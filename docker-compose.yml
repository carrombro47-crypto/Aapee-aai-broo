version: '3.8'

services:
  api:
    build: .
    container_name: myprojects-ms-video-api
    ports:
      - "5000:5000"
    environment:
      DEBUG: "false"
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - api-network

networks:
  api-network:
    driver: bridge
